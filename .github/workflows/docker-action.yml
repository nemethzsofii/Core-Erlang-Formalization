# This file was generated from `meta.yml`, please do not edit manually.
# Follow the instructions on https://github.com/coq-community/templates to regenerate.
name: Docker CI

on:
  schedule:
    - cron: '10 1 * * 0'
  push:
    branches:
      - master
  pull_request:
    branches:
      - '**'

jobs:
  build:
    # the OS must be GNU/Linux to be able to use the docker-coq-action
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - 'rocq/rocq-prover:9.1'
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: coq-community/docker-coq-action@v1
        with:
          opam_file: 'coq-core-erlang-formalization.opam'
          custom_image: ${{ matrix.image }}
          before_install: |
            startGroup "Setup and print opam config"
              opam repo -a --set-default add coq-extra-dev https://coq.inria.fr/opam/extra-dev
              opam repo add iris-dev https://gitlab.mpi-sws.org/iris/opam.git
              opam install rocq-stdpp
              opam config list; opam repo list; opam list
            endGroup

      - name: Install Haskell (GHC + Cabal)
        run: |
          sudo apt-get update
          sudo apt-get install -y ghc cabal-install

      - name: Build project (make)
        run: |
          make

      - name: Extract Haskell semantics
        run: |
          coqc src/Interpreter/HaskellExtraction.v

      - name: Preprocess extracted Haskell code
        run: |
          cd src/Interpreter/HaskellSrc
          chmod +x preprocess.sh
          ./preprocess.sh exe/RocqExtraction.hs

      - name: Extract example programs
        run: |
          coqc src/Interpreter/ExampleProgExtraction.v

      - name: Build interpreter
        run: |
          cd src/Interpreter/HaskellSrc
          cabal build Interpreter

      - name: Run interpreter
        run: |
          cd src/Interpreter/HaskellSrc
          cabal run Interpreter

# See also:
# https://github.com/coq-community/docker-coq-action#readme
# https://github.com/erikmd/docker-coq-github-action-demo
